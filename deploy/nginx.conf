server {
    listen 27191 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/livems-ip-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/livems-ip.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/word-mem.access.log;
    error_log /var/log/nginx/word-mem.error.log;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:27190;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
